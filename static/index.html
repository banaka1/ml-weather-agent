<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能助手</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 左侧边栏 -->
<aside class="sidebar">
    <div class="side-top">
        <div class="side-title"><span class="dot"></span>智能助手</div>
    </div>
    <button class="side-new" id="newBtn">+ 新建会话</button>
    <ul class="side-list" id="sideList">
        <li class="active">当前会话</li>
    </ul>
    <div class="side-bottom">LangChain + FastAPI</div>
</aside>

<!-- 中间对话区 -->
<section class="main">
    <div class="main-head">当前会话</div>
    <div class="msgbox" id="box">
        <div class="m ai">
            <div class="av">🤖</div>
            <div class="b">你好！我可以帮你查天气，也能聊别的～试试问「平顶山今天天气怎么样？」</div>
        </div>
    </div>
    <div class="input">
        <input type="text" id="inp" placeholder="输入消息，回车发送..." autocomplete="off">
        <button id="btn">发送</button>
    </div>
</section>

<script src="js/app.js"></script>
</body>
</html>
