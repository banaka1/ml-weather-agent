<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能助手 · 豆包风格</title>
<style>
:root{
  --brand1:#667eea;
  --brand2:#764ba2;
  --brand-grad:linear-gradient(135deg,#667eea,#764ba2);
  --bg:#f5f6fa;
  --panel:#ffffff;
  --text:#1f2329;
  --text2:#6b7280;
  --text3:#9aa0a8;
  --border:#eef0f4;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
.app{display:flex;height:100vh}

/* ========== 左侧导航栏 ========== */
.sidebar{width:250px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.side-head{display:flex;align-items:center;gap:9px;padding:18px 16px 12px}
.logo{width:26px;height:26px;border-radius:8px;background:var(--brand-grad);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700;flex-shrink:0}
.brand{font-size:16px;font-weight:700;white-space:nowrap}
.side-foot{border-top:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:10px;margin-top:auto}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--brand-grad);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;flex-shrink:0}
.user-name{font-size:13px;font-weight:600}

/* ========== 主内容区 ========== */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:56px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:20px;padding:0 20px;flex-shrink:0}
.topbar .title{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 0 3px rgba(52,211,153,.18)}

/* ========== 消息区 ========== */
.chat{flex:1;overflow-y:auto;padding:28px 24px;scroll-behavior:smooth}
.chat-inner{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

/* 欢迎引导页 */
.welcome{text-align:center;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:0}
.w-bot{width:72px;height:72px;border-radius:22px;background:var(--brand-grad);margin:0 auto 18px;display:flex;align-items:center;justify-content:center;font-size:34px;box-shadow:0 12px 30px rgba(102,126,234,.35);animation:float 3.2s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.w-title{font-size:24px;font-weight:700;margin-bottom:6px}
.w-sub{font-size:14px;color:var(--text2);margin-bottom:30px}

/* 消息气泡 */
.msg{display:flex;gap:10px;margin-bottom:18px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.me{flex-direction:row-reverse}
.msg .av{width:34px;height:34px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px}
.msg.ai .av{background:var(--brand-grad);color:#fff}
.msg.me .av{background:#dfe6f5;color:#3b4a7a}
.msg .bub{max-width:68%;padding:11px 15px;border-radius:13px;font-size:14px;line-height:1.65;word-break:break-word;white-space:pre-wrap}
.msg.ai .bub{background:var(--panel);border:1px solid var(--border);border-top-left-radius:4px}
.msg.me .bub{background:var(--brand-grad);color:#fff;border-top-right-radius:4px}
.typing{display:flex;gap:5px;align-items:center;padding:4px 2px}
.typing span{width:7px;height:7px;border-radius:50%;background:#c3c8d8;animation:blink 1.3s infinite both}
.typing span:nth-child(2){animation-delay:.18s}
.typing span:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{transform:scale(.6);opacity:.5}40%{transform:scale(1);opacity:1}}

/* ========== 输入区 ========== */
.inputbar{border-top:1px solid var(--border);background:var(--panel);padding:10px 20px 14px;flex-shrink:0}
.in-wrap{max-width:760px;margin:0 auto;border:1px solid var(--border);border-radius:16px;background:#fff;transition:.2s;box-shadow:0 2px 10px rgba(0,0,0,.03)}
.in-wrap:focus-within{border-color:#aab2ff;box-shadow:0 4px 16px rgba(102,126,234,.12)}
.in-row{display:flex;align-items:center;gap:8px;padding:6px 12px 8px}
.in-row input{flex:1;border:none;outline:none;font-size:14px;background:transparent;color:var(--text);padding:6px 4px}
.in-row input::placeholder{color:var(--text3)}
.send{width:36px;height:36px;border-radius:50%;border:none;background:var(--brand-grad);color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;flex-shrink:0;box-shadow:0 3px 10px rgba(102,126,234,.3)}
.send:hover{transform:scale(1.06)}
.send:disabled{opacity:.4;cursor:not-allowed;transform:none}

/* 滚动条 */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#d5d9e2;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#c0c6d4}
</style>
</head>
<body>
<div class="app">
  <!-- ===== 左侧导航栏 ===== -->
  <aside class="sidebar">
    <div class="side-head">
      <div class="logo">智</div>
      <div class="brand">智能助手</div>
    </div>
    <div class="side-foot">
      <div class="avatar">张</div>
      <div class="user-name">张家力</div>
    </div>
  </aside>

  <!-- ===== 主内容区 ===== -->
  <main class="main">
    <header class="topbar">
      <div class="title"><span class="dot"></span>智能助手</div>
    </header>

    <div class="chat" id="chat">
      <div class="chat-inner">
        <!-- 欢迎引导页 -->
        <div class="welcome" id="welcome">
          <div class="w-bot">🤖</div>
          <div class="w-title">今天有什么工作要处理？</div>
          <div class="w-sub">发消息或创建任务，我随时帮你搞定</div>
        </div>
      </div>
    </div>

    <!-- 输入区 -->
    <footer class="inputbar">
      <div class="in-wrap">
        <div class="in-row">
          <input type="text" id="inp" placeholder="发消息或创建任务... 使用技能 @ 添加资料" autocomplete="off">
          <button class="send" id="btn" title="发送">➤</button>
        </div>
      </div>
    </footer>
  </main>
</div>

<script>
const box = document.getElementById('chat');
const inner = document.querySelector('.chat-inner');
const welcome = document.getElementById('welcome');
const inp = document.getElementById('inp');
const btn = document.getElementById('btn');

/* ---------- 本地模拟回复（无后端时兜底） ---------- */
function mockReply(text){
  const t = text.toLowerCase();
  if(t.includes('天气')) return '今天天气多云转晴，气温 18~26℃，适合出行～如果你告诉我具体城市，我可以给出更精确的预报。';
  if(t.includes('java') || t.includes('游戏')) return '可以！经典方案是用 Swing 写一个贪吃蛇或俄罗斯方块，单文件即可运行。需要我帮你生成完整可运行的代码吗？';
  if(t.includes('npm') || t.includes('警告')) return 'npm 警告通常分两类：一是 peer dependency 冲突，建议检查 package.json 中的版本范围；二是已弃用警告，不影响运行但建议尽快升级。把具体警告贴给我，我帮你定位。';
  if(t.includes('redis')) return 'Redis 启动失败先查三点：1) 端口 6379 是否被占用；2) 配置文件 redis.conf 的 daemonize 与 bind 设置；3) 日志里的报错行。把日志发我，我帮你逐行分析。';
  if(t.includes('简历') || t.includes('自我评价')) return '没问题，把你的经历要点发给我，我可以帮你润色成简洁有力的项目描述和自我评价，突出成果量化。';
  if(t.includes('调研') || t.includes('分析')) return '好的，请告诉我调研的主题和目标，我可以帮你拆解框架、收集资料并整理成结构化报告。';
  if(t.includes('工作') || t.includes('清单')) return '好的，我可以帮你把今天的工作整理成待办清单。请列出事项，我按优先级和时间帮你排好。';
  if(t.includes('表单') || t.includes('formdata')) return 'FormData 是浏览器内置的键值对表单对象，主要用于文件上传和表单提交，配合 fetch 的 body 直接传即可，浏览器会自动设置 multipart 头。需要示例代码吗？';
  return '收到！这是本地模拟回复（没有连接后端）。如果你部署了 /api/chat 接口，我会自动走真实 AI 回复。你可以试试问“天气”、“Java”或“Redis”。';
}

/* ---------- 发送流程 ---------- */
function addMsg(role, text){
  const m = document.createElement('div');
  m.className = 'msg ' + (role === 'me' ? 'me' : 'ai');
  const av = role === 'me' ? '👤' : '🤖';
  m.innerHTML = `<div class="av">${av}</div><div class="bub"></div>`;
  m.querySelector('.bub').textContent = text;
  inner.appendChild(m);
  box.scrollTop = box.scrollHeight;
  return m;
}
function addTyping(){
  const m = document.createElement('div');
  m.className = 'msg ai';
  m.innerHTML = `<div class="av">🤖</div><div class="bub"><div class="typing"><span></span><span></span><span></span></div></div>`;
  inner.appendChild(m);
  box.scrollTop = box.scrollHeight;
  return m;
}
function startConversation(question){
  // 进入对话模式：隐藏欢迎页，发送问题
  welcome.style.display = 'none';
  sendQuestion(question);
}
async function sendQuestion(text){
  const t = (text || '').trim();
  if(!t) return;
  addMsg('me', t);
  const typing = addTyping();
  btn.disabled = true;
  try{
    let reply;
    // 优先尝试真实后端，失败自动降级到本地模拟
    try{
      const r = await fetch('/api/chat', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({message:t})
      });
      const d = await r.json();
      reply = d.reply || d.detail || '（后端未返回内容）';
    }catch(e){
      await new Promise(res => setTimeout(res, 600 + Math.random()*700)); // 模拟思考延迟
      reply = mockReply(t);
    }
    typing.remove();
    addMsg('ai', reply);
  }catch(e){
    typing.remove();
    addMsg('ai', '请求失败：' + e.message);
  }
  btn.disabled = false;
  inp.focus();
}
function send(){
  const t = inp.value.trim();
  if(!t) return;
  inp.value = '';
  if(welcome.style.display !== 'none') welcome.style.display = 'none';
  sendQuestion(t);
}

/* ---------- 事件绑定 ---------- */
btn.addEventListener('click', send);
inp.addEventListener('keydown', e => { if(e.key === 'Enter') send(); });
</script>
</body>
</html>
